[package]
name = "io"
description = "I/O backends behind one trait: io_uring on Linux, pread/pwrite elsewhere, memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
waraq.workspace = true
thiserror.workspace = true
calc.workspace = true

libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
js-sys = { version = "=0.3.106", optional = true }
web-sys = { version = "=0.3.106", optional = true, features = [
  "DomException",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemReadWriteOptions",
  "FileSystemSyncAccessHandle",
  "StorageManager",
] }

[features]
uring = ["dep:io-uring"]
opfs = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[[example]]
name = "opfs"
required-features = ["opfs"]

[lints]
workspace = true
